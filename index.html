<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090e11">
  <meta name="description" content="Geometry Wars Clone Genesis. A twin-stick arcade shooter on a living gravitational lattice.">
  <title>GeoWars Clone — Genesis</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./src/platform/three.js"}}</script>
</head>
<body data-view="menu">
  <svg class="symbols" aria-hidden="true"><defs>
    <symbol id="sound" viewBox="0 0 24 24"><path d="m3 9 4 0 5-4v14l-5-4H3zM16 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></symbol>
    <symbol id="expand" viewBox="0 0 24 24"><path d="M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6"/></symbol>
    <symbol id="book" viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4zM15 4v5h5M8 12h7m-7 4h6"/></symbol>
    <symbol id="settings" viewBox="0 0 24 24"><path d="M3 7h5m5 0h8M3 17h10m5 0h3"/><circle cx="10.5" cy="7" r="2.5"/><circle cx="15.5" cy="17" r="2.5"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="m5 3 15 9-15 9z"/></symbol>
    <symbol id="enter" viewBox="0 0 24 24"><path d="M20 5v9H4m5-5-5 5 5 5"/></symbol>
    <symbol id="trophy" viewBox="0 0 24 24"><path d="M7 4h10v5c0 7-10 7-10 0zM7 6H3v2c0 3 2 4 5 4m9-6h4v2c0 3-2 4-5 4m-4 2v5m-5 1h10"/></symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path d="M8 4v16m8-16v16" stroke-width="3.5"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m5 5 14 14m0-14L5 19"/></symbol>
  </defs></svg>
  <div id="console">
    <header class="topbar">
      <div class="studio"><img class="brand-mark" src="./assets/mark.svg" alt=""><span>NITROUS <b>STUDIO</b></span></div>
      <span class="head-rule"></span>
      <span class="header-mode" id="header-mode">Arcade survival</span>
      <div class="header-actions">
        <button class="utility sound" id="sound-btn" aria-label="Mute sound"><svg><use href="#sound"/></svg><span id="sound-label">Sound on</span></button>
        <button class="utility" id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen"><svg><use href="#expand"/></svg></button>
        <button class="utility" id="pause-btn" aria-label="Pause run" title="Pause"><svg><use href="#pause"/></svg></button>
      </div>
    </header>
    <main id="stage">
      <canvas id="screen" aria-label="Geometry Wars Clone arcade arena"></canvas>
      <div class="menu-overlay" id="home">
        <div class="menu-main">
          <p class="eyebrow"><i></i>Geometric survival<i></i></p>
          <h1 aria-label="Geometry Wars Clone"><span>Geo</span><span>Wars</span><i>Clone</i></h1>
          <nav class="arcade-nav" aria-label="Main menu">
            <button class="launch" id="launch" disabled><span id="launch-label">Initializing</span></button>
            <button id="scores-btn">High scores</button>
            <button id="settings-btn">Settings</button>
            <button id="manual-btn">How to play</button>
          </nav>
        </div>
      </div>
      <div id="hud" hidden>
        <div class="hud-block score"><small>Score</small><b id="score">000000</b><span id="mult">×1</span></div>
        <div class="hud-block wave"><small id="sector">Sector 01</small><span id="time">00:00</span></div>
        <div class="hud-block hull"><small>Hull</small><div id="hull" aria-label="3 hull points"><i></i><i></i><i></i></div></div>
      </div>
      <div id="notice" aria-live="polite"></div>
      <div id="touch-move" class="stick" hidden><i></i></div><div id="touch-aim" class="stick" hidden><i></i></div>
      <div id="dialog-layer" hidden><section id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div>
      <div id="graphic-error" role="alert" hidden><b>Graphics unavailable</b><p id="error-copy"></p><button onclick="location.reload()">Reload</button></div>
    </main>
    <footer id="footer">
      <div id="menu-footer"><span class="live"><i></i> Flight deck</span><span class="footer-sep"></span><span class="foot-mode"><b>A / D</b> Rotate <span>·</span> <b>W</b> Thrust <span>·</span> <b>Mouse</b> Aim & fire</span><span class="best"><svg><use href="#trophy"/></svg> Personal best <b id="best">000000</b></span></div>
      <div id="game-footer" hidden><span class="weapon"><i></i><small>Weapon</small><b id="weapon">I / Pulse lance</b></span><span class="flux"><small>Flux</small><b id="flux">0 / 4</b></span><button id="pulse"><span class="pulse-meter"></span><strong>Nova pulse</strong> <small id="pulse-info">Ready · Space</small></button></div>
    </footer>
  </div>
  <noscript>Enable JavaScript to play VECTOR//NOVA.</noscript>
  <script type="module" src="./src/boot.js"></script>
</body>
</html>
